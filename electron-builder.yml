appId: com.kirakira.wechat-universal
productName: WeChat
directories:
  buildResources: resources
  output: release
files:
  - dist/**/*
  - node_modules/**/*
  - "!node_modules/@journeyapps/sqlcipher/deps/**"
  - "!node_modules/@journeyapps/sqlcipher/src/**"
asar: true
asarUnpack:
  - "node_modules/@journeyapps/sqlcipher/**"
mac:
  category: public.app-category.social-networking
  target:
    - target: dir
  icon: resources/icon.icns
  hardenedRuntime: false
win:
  target: [nsis, portable]
  icon: resources/icon.ico
linux:
  target: [AppImage, deb]
  icon: resources/icon.png
  category: Network
